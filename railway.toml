[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Runs from the *new* image, with the service's variables, while the old
# instance is still serving — the same window `docs/DEPLOY.md` says the old
# code tolerates a newer schema in. Without it, the migration and the image
# that requires it ship together but only one of them deploys itself, so the
# ordinary way to release was also the way to take the bot down.
#
# No-op unless ADMIN_DATABASE_URL is set (a superuser DSN; migrations are
# owner-level DDL, and neither runtime role owns a table). A failure here
# exits non-zero and aborts the deploy, leaving the old instance up.
preDeployCommand = ["python -m ctb.db.upgrade"]

# Service variables cannot be set from this file; set them in the Railway UI.
# There is no volume any more — all state is in PostgreSQL — so the old
# `RAILWAY_RUN_UID=0` ownership trap is gone with it.
#
# Exactly one instance, always. Two would fight over Telegram's getUpdates
# (409 Conflict), and only one process may hold the supervisor lease. The
# lease in the database is the belt to this braces.
#
# Replica count is NOT settable from this file: `numReplicas` is only valid
# nested under `multiRegionConfig.<region>`, never at the top of [deploy].
# One replica is the service default — confirm the UI reads "1 Replica".
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
# Generous on purpose. Nothing listens on /health until `build_runtime` has
# opened both pools and verified the schema, so *every* misconfiguration —
# a missing variable, an unbootstrapped database, the superuser DSN, a wrong
# host — presents identically as "1/1 replicas never became healthy".
#
# The real reason is always in the deploy log, but only if the process lives
# long enough to print it. At 30s the platform gave up at the same moment the
# database connect timed out, so the useful line never appeared.
healthcheckTimeout = 120

# Stop the old instance before starting the new one, so a redeploy never has
# two pollers live at once. Delivery claims tolerate an overlap anyway
# (`FOR UPDATE SKIP LOCKED` plus a 60s orphan window), but not overlapping is
# still cheaper than recovering from it.
overlapSeconds = 0
